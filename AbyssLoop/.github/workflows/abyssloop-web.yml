name: Abyss Loop Standalone Web Export and Browser QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '**/*.gd'
      - '**/*.tscn'
      - '**/*.tres'
      - '**/*.json'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.svg'
      - '**/*.ogg'
      - '**/*.wav'
      - '**/*.mp3'
      - '**/*.ttf'
      - '**/*.import'
      - '**/*.gdshader'
      - 'assets/**'
      - 'localization/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'tools/**'
      - 'tests/**'
      - '*.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: abyssloop-standalone-web-pages
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages metadata
        uses: actions/configure-pages@v5

      - name: Install and verify Godot 4.7.2 plus Web export templates
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/godot-web-export"
          mkdir -p "$work/bin" "$work/templates" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl --fail --location --silent --show-error --retry 3 \
            'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=linux.x86_64.zip' \
            -o "$work/godot.zip"
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  '"$work/godot.zip" | sha256sum --check --status
          unzip -q "$work/godot.zip" -d "$work/bin"
          GODOT_BIN="$(find "$work/bin" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

          curl --fail --location --silent --show-error --retry 3 \
            'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=export_templates.tpz' \
            -o "$work/templates.tpz"
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  '"$work/templates.tpz" | sha256sum --check --status
          unzip -q "$work/templates.tpz" -d "$work/templates"
          template_source="$(find "$work/templates" -type f -name 'web_release.zip' -print -quit | xargs -r dirname)"
          test -n "$template_source"
          cp "$template_source"/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Source Web export preflight
        run: python3 tools/web_export_preflight.py --mode source --root . --report "$RUNNER_TEMP/web-source-preflight.md"

      - name: Run static regression suite
        run: python3 tests/run_static_suite.py

      - name: Import project resources
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --import

      - name: Run Godot gameplay acceptance in an isolated profile
        shell: bash
        run: |
          set -euo pipefail
          test_root="${RUNNER_TEMP}/AbyssLoopRuntimeAcceptance"
          mkdir -p "$test_root"
          tar --exclude="./.git" --exclude="./.godot" --exclude="./build" -cf - . | tar -xf - -C "$test_root"
          rm -rf "$test_root/.godot"
          sed -i 's/^config\/name="Abyss Loop"$/config\/name="Abyss Loop CI Acceptance"/' "$test_root/project.godot"
          grep -q '^config/name="Abyss Loop CI Acceptance"$' "$test_root/project.godot"
          "$GODOT_BIN" --headless --editor --path "$test_root" --import
          timeout 30s "$GODOT_BIN" --headless --path "$test_root" res://tests/smoke_test_runner.tscn
          timeout 60s "$GODOT_BIN" --headless --path "$test_root" res://tests/save_system_regression_runner.tscn
          rm -rf "$HOME/.local/share/godot/app_userdata/Abyss Loop CI Acceptance"
          timeout 30s "$GODOT_BIN" --headless --path "$test_root" res://tests/expedition_runtime_acceptance_runner.tscn

      - name: Capture five automated engine runs for Stage64B
        shell: bash
        run: |
          set -euo pipefail
          test_root="${RUNNER_TEMP}/AbyssLoopRuntimeAcceptance"
          mkdir -p "$RUNNER_TEMP/web-qa"
          profile_data="$HOME/.local/share/godot/app_userdata/Abyss Loop CI Acceptance"
          rm -f "$profile_data/STAGE64B_AUTOMATED_ENGINE_RUNS.json"
          timeout 360s "$GODOT_BIN" --headless --path "$test_root" res://tests/stage64b_engine_run_capture_runner.tscn
          capture="$profile_data/STAGE64B_AUTOMATED_ENGINE_RUNS.json"
          test -s "$capture"
          cp "$capture" "$RUNNER_TEMP/web-qa/STAGE64B_AUTOMATED_ENGINE_RUNS.json"
          python3 tools/real_run_balance.py \
            --input "$RUNNER_TEMP/web-qa/STAGE64B_AUTOMATED_ENGINE_RUNS.json" \
            --output "$RUNNER_TEMP/web-qa/STAGE64B_AUTOMATED_ENGINE_RUNS_ANALYSIS.md" \
            --label "Automated engine QA (not human playtest)" \
            --godot-version "4.7.2.stable" --minimum-repeats 5

      - name: Run 12-loop long expedition runtime acceptance
        shell: bash
        run: |
          set -euo pipefail
          test_root="${RUNNER_TEMP}/AbyssLoopRuntimeAcceptance"
          timeout 90s "$GODOT_BIN" --headless --path "$test_root" res://tests/long_expedition_runtime_acceptance_runner.tscn

      - name: Capture Stage71 real-engine balance matrix
        shell: bash
        run: |
          set -euo pipefail
          test_root="${RUNNER_TEMP}/AbyssLoopRuntimeAcceptance"
          mkdir -p "$RUNNER_TEMP/web-qa"
          profile_data="$HOME/.local/share/godot/app_userdata/Abyss Loop CI Acceptance"
          rm -f "$profile_data/STAGE71_BALANCE_MATRIX.json"
          timeout 900s "$GODOT_BIN" --headless --path "$test_root" res://tests/stage71_balance_matrix_runner.tscn
          capture="$profile_data/STAGE71_BALANCE_MATRIX.json"
          test -s "$capture"
          cp "$capture" "$RUNNER_TEMP/web-qa/STAGE71_BALANCE_MATRIX.json"
          python3 tools/real_run_balance.py \
            --input "$RUNNER_TEMP/web-qa/STAGE71_BALANCE_MATRIX.json" \
            --output "$RUNNER_TEMP/web-qa/STAGE71_BALANCE_MATRIX_REPORT.md" \
            --label "Automated engine QA — Stage71 matrix (not human playtest)" \
            --godot-version "4.7.2.stable" --minimum-repeats 3

      - name: Export Godot Web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          "$GODOT_BIN" --headless --path . --export-release "Web" build/web/index.html
          python3 tools/web_export_preflight.py --mode build --root build/web --report "$RUNNER_TEMP/web-build-preflight.md"

      - name: Install Playwright Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/web-qa-venv"
          "$RUNNER_TEMP/web-qa-venv/bin/python" -m pip install --disable-pip-version-check playwright
          "$RUNNER_TEMP/web-qa-venv/bin/python" -m playwright install --with-deps chromium

      - name: Run browser smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/web-qa"
          "$RUNNER_TEMP/web-qa-venv/bin/python" tools/web_browser_smoke_test.py \
            --directory build/web --timeout 90 \
            --screenshot "$RUNNER_TEMP/web-qa/abyssloop-web-smoke.png" \
            --report "$RUNNER_TEMP/web-qa/abyssloop-web-smoke.json"

      - name: Run browser gameplay acceptance
        run: |
          "$RUNNER_TEMP/web-qa-venv/bin/python" tools/web_gameplay_browser_acceptance.py \
            --directory build/web --timeout 90 \
            --screenshots-dir "$RUNNER_TEMP/web-qa/gameplay" \
            --report "$RUNNER_TEMP/web-qa/abyssloop-web-gameplay.json"

      - name: Package standalone Godot project ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/AbyssLoop_Godot_Prototype_61_RC7.zip"
          python3 tools/package_release.py --output "$archive" --release-candidate
          test -s "$archive"

      - name: Upload standalone Godot project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AbyssLoop-Godot-Prototype-61-RC7-${{ github.sha }}
          path: ${{ runner.temp }}/AbyssLoop_Godot_Prototype_61_RC7.zip
          if-no-files-found: error
          retention-days: 14
      - name: Save deployable Web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Preserve QA screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abyssloop-web-qa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/web-source-preflight.md
            ${{ runner.temp }}/web-build-preflight.md
            ${{ runner.temp }}/web-qa/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish tested Web build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
