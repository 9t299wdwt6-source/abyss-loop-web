name: Abyss Loop Player Project ZIP

on:
  push:
    branches:
      - feature/stage92-tile-card-ux
    paths:
      - '.github/workflows/abyssloop-player-package.yml'
      - 'AbyssLoop/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-project:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4

      - name: Package Godot project with the required top-level folder
        shell: bash
        run: |
          set -euo pipefail
          test -f AbyssLoop/project.godot
          stage="${RUNNER_TEMP}/abyssloop-player-package"
          mkdir -p "$stage"
          cp -a AbyssLoop "$stage/AbyssLoop"
          cat > "$stage/AbyssLoop/MANUAL_TEST_BUILD_INFO_RU.txt" <<EOF
          ABYSS LOOP — АРХИВ ДЛЯ РУЧНОЙ ПРОВЕРКИ

          Исходный commit: ${GITHUB_SHA}
          Ветка: ${GITHUB_REF_NAME}
          Версия Godot для проекта: 4.7.2 stable (рекомендуется та же версия).

          Как открыть:
          1. Распакуйте архив.
          2. В Godot Project Manager нажмите Import.
          3. Выберите файл AbyssLoop/project.godot в распакованной папке.
          4. Откройте проект и запустите главную сцену (F6/F5; предпочтительно F5).

          Это проект Godot, не самостоятельный EXE. Данная упаковка не является
          подтверждением ручного игрового теста и не включает экспорт Windows.
          EOF
          (cd "$stage" && zip -qr "$RUNNER_TEMP/AbyssLoop.zip" AbyssLoop)
          zip -T "$RUNNER_TEMP/AbyssLoop.zip"
          python3 - "$RUNNER_TEMP/AbyssLoop.zip" <<'PY'
          import sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              names = z.namelist()
              assert bad is None, f"Corrupt entry: {bad}"
              assert names, "Empty archive"
              assert all(name.startswith("AbyssLoop/") for name in names), "Archive contains paths outside AbyssLoop/"
              assert "AbyssLoop/project.godot" in names, "project.godot missing at expected path"
              assert "AbyssLoop/MANUAL_TEST_BUILD_INFO_RU.txt" in names, "Manual test notes missing"
              assert not any(name.startswith("AbyssLoop/AbyssLoop/") for name in names), "Duplicated top-level folder"
              print(f"PACKAGE VALID: {len(names)} entries")
          PY
          sha256sum "$RUNNER_TEMP/AbyssLoop.zip" | tee "$RUNNER_TEMP/AbyssLoop.zip.sha256"

      - name: Upload project ZIP for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: AbyssLoop-manual-test-package
          path: ${RUNNER_TEMP}/AbyssLoop.zip
          if-no-files-found: error
          retention-days: 14
